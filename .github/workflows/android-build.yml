name: Android CI/CD Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper (if present)
        run: chmod +x gradlew 2>/dev/null || true

      - name: Verify google-services.json
        run: |
          if [ -f "app/google-services.json" ]; then
            echo "google-services.json is present."
          else
            echo "Warning: app/google-services.json missing, using environment secret if available."
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            fi
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cafe-digitalmenu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
